name: ${COMPOSE_PROJECT_NAME:-app}

services:
  backend:
    image: ${COMPOSE_PROJECT_NAME:-app}-backend:${TAG:-latest}
    pull_policy: never
    env_file:
      - path: .env
        required: false
    environment:
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
