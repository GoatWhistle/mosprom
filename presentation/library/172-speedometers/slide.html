<section class="slide" id="speedometers" data-title="Сравнение спидометрами">
  <h2 class="title a">{{Втрое быстрее}} <em>{{ручного}}</em></h2>

  <div class="body is-tall">
    <div class="grid is-2 sp3">
      <div class="sp3-item"><span class="eyebrow a" style="--d:0.1s">{{Вручную}}</span><div class="sp3-viz" data-viz="gauge" data-values="34" data-max="120" data-danger="0" data-caption="{{документов в час}}" data-delay="0.2"></div><p class="sp3-foot a" style="--d:1.2s"><span class="ico is-sm" data-icon="clock"></span>{{8 ч на 270 документов}}</p></div>
      <div class="sp3-item is-us"><span class="eyebrow a" style="--d:0.3s"><span class="mark" data-mark></span>{{С продуктом}}</span><div class="sp3-viz" data-viz="gauge" data-values="108" data-max="120" data-caption="{{документов в час}}" data-delay="0.4"></div><p class="sp3-foot is-us a" style="--d:1.4s"><span class="ico is-sm" data-icon="clock"></span>{{2,5 ч на те же 270}}<b>{{×3,2}}</b></p></div>
    </div>
  </div>
</section>
