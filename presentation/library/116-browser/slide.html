<section class="slide" id="browser" data-title="Браузер">
  <h2 class="title a">{{Один экран}} <em>{{вместо пяти вкладок}}</em></h2>

  <div class="body is-tall">
    <div class="bw s" style="--d:0.2s">
      <div class="bw-bar"><i></i><i></i><i></i><span class="bw-url">app.{{product}}.ru/{{requests}}/1042</span></div>
      <div class="bw-page">
        <aside class="bw-side"><span class="is-on"></span><span></span><span></span><span></span></aside>
        <div class="bw-main">
          <div class="bw-head a" style="--d:0.5s"><b>{{Заявка 1042}}</b><span class="bw-status"><span class="badge is-warning bw-old">{{На проверке}}</span><span class="badge is-success bw-new"><span class="ico" data-icon="check"></span>{{Одобрено}}</span></span></div>
          <div class="bw-cards">
            <span class="bw-card a" style="--d:0.7s"><i>{{Сумма}}</i><b>{{1 250 000 ₽}}</b></span><span class="bw-card a" style="--d:0.8s"><i>{{Контрагент}}</i><b>{{ООО Альфа}}</b></span><span class="bw-card a" style="--d:0.9s"><i>{{Риск}}</i><b class="is-ok">{{низкий}}</b></span>
          </div>
          <div class="bw-panel a" style="--d:1s"><span class="bw-line"></span><span class="bw-line is-short"></span><span class="bw-line"></span></div>
          <span class="bw-btn a" style="--d:1.2s">{{Одобрить}}</span>
        </div>
      </div>
      <span class="bw-cursor"><span class="ico" data-icon="target"></span></span>
    </div>
  </div>
</section>
