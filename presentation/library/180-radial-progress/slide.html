<section class="slide" id="radial-progress" data-title="Готовность по модулям">
  <h2 class="title a">{{Ядро готово}}, <em>{{интерфейс догоняет}}</em></h2>

  <div class="body is-tall">
    <div class="grid is-4 rp">
      <div class="rp-item"><div class="rp-viz" data-viz="donut" data-rest data-values="100,0" data-center="100" data-unit="%" data-delay="0.2"></div><b class="a" style="--d:0.9s">{{Разбор}}</b><span class="badge is-success a" style="--d:1s">{{на стенде}}</span></div>
      <div class="rp-item"><div class="rp-viz" data-viz="donut" data-rest data-values="90,10" data-center="90" data-unit="%" data-delay="0.35"></div><b class="a" style="--d:1s">{{Проверка}}</b><span class="badge is-success a" style="--d:1.1s">{{на стенде}}</span></div>
      <div class="rp-item"><div class="rp-viz" data-viz="donut" data-rest data-values="70,30" data-center="70" data-unit="%" data-delay="0.5"></div><b class="a" style="--d:1.1s">{{Интерфейс}}</b><span class="badge is-warning a" style="--d:1.2s">{{в работе}}</span></div>
      <div class="rp-item"><div class="rp-viz" data-viz="donut" data-rest data-values="30,70" data-center="30" data-unit="%" data-delay="0.65"></div><b class="a" style="--d:1.2s">{{Интеграции}}</b><span class="badge a" style="--d:1.3s">{{план}}</span></div>
    </div>
  </div>
</section>
