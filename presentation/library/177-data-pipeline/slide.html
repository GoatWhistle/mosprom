<section class="slide" id="data-pipeline" data-title="Конвейер данных">
  <h2 class="title a">{{Из 40 тысяч}} <em>{{чистые 31}}</em></h2>

  <div class="body is-tall">
    <div class="dp-wrap">
    <div class="dp">
      <div class="dp-st a" style="--d:0.2s"><span class="tile"><span class="ico" data-icon="database"></span></span><b>{{Сырые}}</b><span class="num">{{40 200}}</span><i style="--w:1"></i></div>
      <div class="dp-st a" style="--d:0.45s"><span class="tile"><span class="ico" data-icon="filter"></span></span><b>{{Без дублей}}</b><span class="num">{{36 900}}</span><i style="--w:0.92"></i><em>{{−3 300}}</em></div>
      <div class="dp-st a" style="--d:0.7s"><span class="tile"><span class="ico" data-icon="shield"></span></span><b>{{Обезличены}}</b><span class="num">{{36 900}}</span><i style="--w:0.92"></i><em class="is-zero">{{ФИО, телефоны}}</em></div>
      <div class="dp-st a" style="--d:0.95s"><span class="tile"><span class="ico" data-icon="check"></span></span><b>{{Валидные}}</b><span class="num">{{31 400}}</span><i style="--w:0.78"></i><em>{{−5 500}}</em></div>
      <div class="dp-st is-out a" style="--d:1.2s"><span class="tile is-accent"><span class="ico" data-icon="layers"></span></span><b>{{В обучении}}</b><span class="num">{{31 400}}</span><i style="--w:0.78"></i></div>
    </div>
    <div class="dp-sum">
      <span class="eyebrow f" style="--d:1.4s">{{Куда ушли 40 200 записей}}</span>
      <div class="dp-bar"><i class="is-ok" style="--f:78;--d:1.5s"><b>{{78%}}</b>{{в обучение}}</i><i class="is-dup" style="--f:8;--d:1.65s"><b>{{8%}}</b></i><i class="is-bad" style="--f:14;--d:1.8s"><b>{{14%}}</b></i></div>
      <div class="dp-legend micro f" style="--d:1.9s"><span><i class="is-ok"></i>{{в обучение}}</span><span><i class="is-dup"></i>{{дубли}}</span><span><i class="is-bad"></i>{{не прошли проверку}}</span></div>
    </div>
    </div>
  </div>
</section>
