<section class="slide" id="price-chart" data-title="Цена с аннотациями">
  <h2 class="title a">{{Мы покупаем}} <em>{{на дне}}</em></h2>

  <div class="body is-tall">
    <div class="pc3-wrap">
    <div class="pc3" data-viz="line" data-curve data-area data-values="64,66,63,61,58,55,53,51,49,52,55,58,57,60,63,66,68,71,70,73" data-labels="{{1 сен}};;;;;;;;;;;;;;;;;;;{{30 сен}}" data-marks="8:{{покупка 49 ₽}};19:{{сейчас 73 ₽}}" data-unit=" ₽" data-names="{{Цена}}" data-no-values data-min="40" data-max="80"></div>
      <aside class="pc3-side">
        <div class="kpi a" style="--d:2.2s"><span class="kpi-label">{{Рост с покупки}}</span><span class="kpi-value pc3-up">{{+49%}}</span><span class="kpi-note">{{с 49 до 73 ₽ за 11 дней}}</span></div>
        <div class="kpi a" style="--d:2.4s"><span class="kpi-label">{{Сигнал модели}}</span><span class="kpi-value">{{8 сен}}</span><span class="kpi-note">{{за день до минимума}}</span></div>
      </aside>
    </div>
  </div>
</section>
