<section class="slide" id="wizard" data-title="Шаги интерфейса">
  <h2 class="title a">{{Три экрана}} <em>{{до результата}}</em></h2>

  <div class="body is-tall">
    <div class="wz">
      <div class="wz-step a" style="--d:0.2s"><span class="wz-n">1</span><div class="wz-screen"><span class="wz-drop"><span class="ico is-lg" data-icon="file"></span>{{Перетащите файл}}</span></div><b>{{Загрузка}}</b></div>
      <span class="wz-arrow f" style="--d:0.5s"><span class="ico" data-icon="arrow-right"></span></span>
      <div class="wz-step a" style="--d:0.6s"><span class="wz-n">2</span><div class="wz-screen"><span class="wz-field"></span><span class="wz-field is-hit"></span><span class="wz-field"></span><span class="wz-field is-short"></span></div><b>{{Проверка полей}}</b></div>
      <span class="wz-arrow f" style="--d:0.9s"><span class="ico" data-icon="arrow-right"></span></span>
      <div class="wz-step is-accent a" style="--d:1s"><span class="wz-n">3</span><div class="wz-screen"><span class="wz-result"><span class="ico is-lg" data-icon="check"></span>{{Можно платить}}</span></div><b>{{Решение}}</b></div>
    </div>
  </div>
</section>
