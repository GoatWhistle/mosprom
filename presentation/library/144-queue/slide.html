<section class="slide" id="queue" data-title="Очередь обработки">
  <h2 class="title a">{{Поток}} <em>{{без ручных шагов}}</em></h2>

  <div class="body is-tall">
    <div class="qu">
      <div class="qu-in"><span class="eyebrow f" style="--d:0.1s">{{Входящие}}</span><span class="qu-doc a" style="--d:0.2s"></span><span class="qu-doc a" style="--d:0.3s"></span><span class="qu-doc a" style="--d:0.4s"></span><span class="qu-doc a" style="--d:0.5s"></span></div>
      <div class="qu-machine s" style="--d:0.4s"><span class="tile is-accent"><span class="ico is-lg" data-icon="cpu"></span></span><b>{{Проверка}}</b><span class="micro">{{0,4 с на документ}}</span><span class="qu-beam only-motion"></span></div>
      <div class="qu-out">
        <span class="eyebrow f" style="--d:0.1s">{{Результат}}</span>
        <span class="qu-res is-ok a" style="--d:1s"><span class="ico is-sm" data-icon="check"></span>{{Принято}}<b class="num">{{412}}</b></span>
        <span class="qu-res a" style="--d:1.2s"><span class="ico is-sm" data-icon="eye"></span>{{Человеку}}<b class="num">{{31}}</b></span>
        <span class="qu-res is-bad a" style="--d:1.4s"><span class="ico is-sm" data-icon="x"></span>{{Отказ}}<b class="num">{{7}}</b></span>
      </div>
      <span class="qu-fly only-motion"></span>
    </div>
  </div>
</section>
