<section class="slide" id="rag" data-title="Поиск и генерация">
  <h2 class="title a">{{Ответ}} <em>{{только из найденного}}</em></h2>

  <div class="body is-tall">
    <div class="rg2">
      <div class="rg2-step a" style="--d:0.2s"><span class="tile"><span class="ico" data-icon="message"></span></span><b>{{Вопрос}}</b><span>{{на естественном языке}}</span></div>
      <span class="rg2-arrow f" style="--d:0.4s"><span class="ico" data-icon="arrow-right"></span></span>
      <div class="rg2-step a" style="--d:0.5s"><span class="tile"><span class="ico" data-icon="search"></span></span><b>{{Поиск}}</b><div class="rg2-docs"><span class="rg2-doc pop" style="--d:0.8s"></span><span class="rg2-doc pop" style="--d:0.85s"></span><span class="rg2-doc is-hit pop" style="--d:0.9s"></span><span class="rg2-doc pop" style="--d:0.95s"></span><span class="rg2-doc is-hit pop" style="--d:1s"></span><span class="rg2-doc pop" style="--d:1.05s"></span></div><span>{{20 кандидатов}}</span></div>
      <span class="rg2-arrow f" style="--d:1.1s"><span class="ico" data-icon="arrow-right"></span></span>
      <div class="rg2-step a" style="--d:1.2s"><span class="tile"><span class="ico" data-icon="filter"></span></span><b>{{Отбор}}</b><span>{{3 лучших фрагмента}}</span></div>
      <span class="rg2-arrow f" style="--d:1.4s"><span class="ico" data-icon="arrow-right"></span></span>
      <div class="rg2-step is-accent a" style="--d:1.5s"><span class="tile is-accent"><span class="ico" data-icon="sparkle"></span></span><b>{{Ответ}}</b><span>{{со ссылками [1] [3]}}</span></div>
      <p class="rg2-rule limit a" style="--d:1.9s"><b>{{Нет источника}}</b>{{модель отвечает «не нашёл» и показывает, где искала}}</p>
    </div>
  </div>
</section>
