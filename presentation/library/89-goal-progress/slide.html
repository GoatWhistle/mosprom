<section class="slide" id="goal-progress" data-title="Путь к цели">
  <h2 class="title a">{{До цели}} <em>{{осталась треть}}</em></h2>

  <div class="body">
    <div class="gp">
      <div class="gp-head">
        <p class="gp-big a" style="--d:0.2s">{{10 из 15}}</p>
        <p class="lead a" style="--d:0.35s">{{пилотных клиентов подписаны, осталось пять до марта}}</p>
      </div>
      <div class="gp-track">
        <span class="gp-fill" style="--w:0.66"></span>
        <span class="gp-mark a" style="--x:0.2;--d:0.8s"><i></i><b>{{Прототип}}</b><span>{{сентябрь}}</span></span>
        <span class="gp-mark a" style="--x:0.45;--d:1s"><i></i><b>{{Первый клиент}}</b><span>{{октябрь}}</span></span>
        <span class="gp-mark is-now a" style="--x:0.66;--d:1.2s"><i></i><b>{{Сейчас}}</b><span>{{10 из 15 клиентов}}</span></span>
        <span class="gp-mark is-goal a" style="--x:1;--d:1.4s"><i></i><b>{{Цель}}</b><span>{{15 клиентов к марту}}</span></span>
      </div>
    </div>
  </div>
</section>
