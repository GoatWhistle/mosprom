<section class="slide" id="swimlane-time" data-title="Дорожки во времени">
  <h2 class="title a">{{Четыре участника}}, <em>{{один час}}</em></h2>

  <div class="body is-tall">
    <div class="sw2">
      <div class="sw2-ruler f" style="--d:0.1s" data-plain><span data-plain>0</span><span data-plain>15</span><span data-plain>30</span><span data-plain>45</span><span data-plain>60</span></div>
      <div class="sw2-lane"><b>{{Клиент}}</b><span class="sw2-bar is-muted gx" style="--x:0;--w:0.08;--d:0.3s">{{заявка}}</span><span class="sw2-bar is-ok gx" style="--x:0.9;--w:0.1;--d:1.5s">{{ответ}}</span></div>
      <div class="sw2-lane"><b>{{Модель}}</b><span class="sw2-bar is-accent gx" style="--x:0.08;--w:0.12;--d:0.6s">{{разбор}}</span><span class="sw2-bar is-accent gx" style="--x:0.62;--w:0.14;--d:1.2s">{{черновик}}</span></div>
      <div class="sw2-lane"><b>{{Код}}</b><span class="sw2-bar is-accent gx" style="--x:0.2;--w:0.1;--d:0.8s">{{проверка}}</span><span class="sw2-bar is-accent gx" style="--x:0.76;--w:0.14;--d:1.35s">{{правила}}</span></div>
      <div class="sw2-lane"><b>{{Юрист}}</b><span class="sw2-bar is-muted gx" style="--x:0.3;--w:0.32;--d:1s">{{спорный пункт}}</span></div>
    </div>
  </div>
</section>
