  <div class="body">
    <div class="sp2">
      <div class="sp2-bar">
        <div class="sp2-part is-train s" style="--d:0.3s;--f:70"><b>{{Обучение}}</b><span class="num">{{7 000}}</span></div>
        <div class="sp2-part is-val s" style="--d:0.5s;--f:15"><b>{{Подбор}}</b><span class="num">{{1 500}}</span></div>

      </div>
    </div>
  </div>
