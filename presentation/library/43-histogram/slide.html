<section class="slide" id="histogram" data-title="Распределение задержки">
  <h2 class="title a">{{Ответ быстрый}} <em>{{и хвост короткий}}</em></h2>

  <div class="body">
    <div class="hg">
      <div data-viz="histogram" data-values="4,12,28,46,58,49,36,24,15,9,6,4,3,2,1,1" data-labels="{{0 мс}};{{400 мс}};{{800 мс}}" data-accent="3,4,5" data-marks="4:p50;11:p95" data-no-ticks></div>
      <div class="hg-kpis">
        <div class="kpi a" style="--d:1.2s"><span class="kpi-label">p50</span><span class="kpi-value">{{210}}<small>{{мс}}</small></span></div>
        <div class="kpi is-accent a" style="--d:1.35s"><span class="kpi-label">p95</span><span class="kpi-value">{{540}}<small>{{мс}}</small></span></div>
        <div class="kpi a" style="--d:1.5s"><span class="kpi-label">{{Запросов}}</span><span class="kpi-value">{{1 000}}</span></div>
      </div>
    </div>
  </div>
</section>
