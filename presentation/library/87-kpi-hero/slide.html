<section class="slide" id="kpi-hero" data-title="Главное число">
  <h2 class="title a">{{Одно число}} <em>{{решает всё}}</em></h2>

  <div class="body is-tall">
    <div class="kh">
      <div class="kh-main">
        <span class="eyebrow a" style="--d:0.2s"><span class="ico is-sm" data-icon="clock"></span>{{Время на одну заявку}}</span>
        <p class="kh-big a" style="--d:0.35s">{{4 мин}}</p>
        <p class="lead a" style="--d:0.5s"><span class="strike">{{2 ч 10 мин}}</span> {{сегодня у оператора}}</p>
      </div>
      <div class="kh-side">
        <div class="kpi a" style="--d:0.8s"><span class="kpi-value">{{×32}}</span><span class="kpi-label">{{быстрее}}</span></div>
        <div class="kpi a" style="--d:0.95s"><span class="kpi-value">{{240}}</span><span class="kpi-label">{{заявок замерено}}</span></div>
        <div class="kpi a" style="--d:1.1s"><span class="kpi-value">{{3}}</span><span class="kpi-label">{{оператора в пилоте}}</span></div>
      </div>
    </div>
  </div>
</section>
