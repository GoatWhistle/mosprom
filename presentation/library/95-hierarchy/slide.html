<section class="slide" id="hierarchy" data-title="Иерархия">
  <h2 class="title a">{{Таксономия}} <em>{{из 12 классов}}</em></h2>

  <div class="body is-tall">
    <div class="hr">
      <div class="hr-root s" style="--d:0.2s"><span class="tile is-accent"><span class="ico" data-icon="layers"></span></span>{{Все обращения}}</div>
      <div class="hr-branches">
        <div class="hr-branch a" style="--d:0.5s"><b>{{Оплата}}</b><span class="hr-share"><i style="--w:0.46"></i></span><span class="hr-pct"><b>{{46%}}</b> {{обращений}}</span><span class="badge">{{Возврат}}</span><span class="badge">{{Двойное списание}}</span><span class="badge">{{Счёт}}</span><span class="badge">{{Рассрочка}}</span></div>
        <div class="hr-branch a" style="--d:0.7s"><b>{{Доставка}}</b><span class="hr-share"><i style="--w:0.34"></i></span><span class="hr-pct"><b>{{34%}}</b> {{обращений}}</span><span class="badge">{{Задержка}}</span><span class="badge is-danger">{{Потеря}}</span><span class="badge">{{Адрес}}</span><span class="badge">{{Самовывоз}}</span></div>
        <div class="hr-branch a" style="--d:0.9s"><b>{{Аккаунт}}</b><span class="hr-share"><i style="--w:0.2"></i></span><span class="hr-pct"><b>{{20%}}</b> {{обращений}}</span><span class="badge">{{Вход}}</span><span class="badge">{{Данные}}</span><span class="badge">{{Удаление}}</span><span class="badge">{{Подписка}}</span></div>
      </div>
    </div>
  </div>
</section>
