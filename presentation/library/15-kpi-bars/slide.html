<section class="slide" id="kpi-bars" data-title="Объём данных">
  <h2 class="title a">{{Сколько собрали}}, <em>{{и из чего}}</em></h2>

  <div class="body is-tall">
    <div class="grid is-split kb">
      <div class="kb-left">
        <div class="card kpi is-accent a" style="--d:0.3s"><span class="kpi-value">{{10 848}}</span><span class="kpi-label">{{документов}}</span><span class="kpi-note">{{3 клиента, январь–сентябрь}}</span></div>
        <div class="card kpi a" style="--d:0.45s"><span class="kpi-value">{{40 544}}</span><span class="kpi-label">{{полей размечено}}</span><span class="kpi-note">{{двумя людьми, согласие 0,91}}</span></div>
        <div class="card kpi a" style="--d:0.6s"><span class="kpi-value">{{12}}</span><span class="kpi-label">{{типов документов}}</span><span class="kpi-note">{{от счёта до претензии}}</span></div>
      </div>
      <div class="card kb-right a" style="--d:0.5s">
        <h3>{{Документы по типам}}</h3>
        <div class="kb-chart" data-viz="bars" data-values="3104,2240,1702,1266,930,561" data-labels="{{Счета}};{{Акты}};{{Накладные}};{{Договоры}};{{Письма}};{{Прочее}}" data-accent="0" data-label-width="220" data-delay="0.8"></div>
      </div>
    </div>
  </div>
</section>
