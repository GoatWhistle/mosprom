<section class="slide" id="video-frame" data-title="Видео в кадре">
  <h2 class="title a">{{Запись}} <em>{{того же сценария}}</em></h2>

  <div class="body is-tall">
    <div class="vf">
      <div class="vf-screen screen is-empty s" style="--d:0.2s">
        <span class="vf-rec"><i></i>{{ЗАПИСЬ 14.10}}</span>
        <span class="vf-play pop" style="--d:0.6s"><span class="ico is-lg" data-icon="play"></span></span>
        <span class="vf-bar"><i></i></span>
        <span class="vf-time" data-plain>0:36 / 1:40</span>
      </div>
      <ul class="vf-notes list">
        <li class="a" style="--d:0.8s"><span><b>{{Это запись}}</b> {{со стенда, не живой показ}}</span></li>
        <li class="a" style="--d:0.95s"><span><b>{{1:40}}</b> {{без монтажа и ускорения}}</span></li>
        <li class="a" style="--d:1.1s"><span><b>{{Живой стенд}}</b> {{по QR на последнем слайде}}</span></li>
      </ul>
    </div>
  </div>
</section>
