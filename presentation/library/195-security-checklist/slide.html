<section class="slide" id="security-checklist" data-title="Безопасность данных">
  <h2 class="title a">{{Данные клиента}} <em>{{не уходят}}</em></h2>

  <div class="body is-tall">
    <div class="sc">
      <div class="sc-shield s" style="--d:0.2s">
        <svg viewBox="0 0 200 240" aria-hidden="true"><path class="sc-shape dr" pathLength="1" style="--d:0.2s;--t:1s" d="M100 10 L185 45 V120 C185 175 145 210 100 230 C55 210 15 175 15 120 V45 Z" /><path class="sc-check dr" pathLength="1" style="--d:1.1s;--t:0.5s" d="M60 120 L90 150 L145 90" /></svg>
      </div>
      <ul class="sc-list">
        <li class="a" style="--d:0.4s"><span class="tile is-accent"><span class="ico" data-icon="server"></span></span><span><b>{{Свой сервер клиента}}</b>{{модель и база внутри периметра}}</span></li>
        <li class="a" style="--d:0.55s"><span class="tile is-accent"><span class="ico" data-icon="lock"></span></span><span><b>{{Шифрование}}</b>{{AES-256 на диске, TLS 1.3 в канале}}</span></li>
        <li class="a" style="--d:0.7s"><span class="tile is-accent"><span class="ico" data-icon="eye"></span></span><span><b>{{Обезличивание}}</b>{{ФИО и паспорта заменяются до модели}}</span></li>
        <li class="a" style="--d:0.85s"><span class="tile is-accent"><span class="ico" data-icon="file"></span></span><span><b>{{Журнал}}</b>{{каждое действие с автором и временем}}</span></li>
      </ul>
    </div>
  </div>
</section>
