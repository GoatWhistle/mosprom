<section class="slide" id="criteria-map" data-title="Карта критериев">
  <h2 class="title a">{{Время защиты}} <em>{{по весам жюри}}</em></h2>

  <div class="body is-tall">
    <div class="cm">
      <div class="cm-row is-head f" style="--d:0.1s"><span>{{Критерий}}</span><span>{{Вес}}</span><span>{{Где показываем}}</span></div>
      <div class="cm-row a" style="--d:0.2s"><b>{{Работоспособность}}</b><span class="cm-w"><i style="--w:0.35"></i><span>35%</span></span><span class="cm-where"><span class="badge is-accent">{{демо}}</span><span class="badge">{{слайд 4}}</span></span></div>
      <div class="cm-row a" style="--d:0.3s"><b>{{Качество решения}}</b><span class="cm-w"><i style="--w:0.25"></i><span>25%</span></span><span class="cm-where"><span class="badge">{{слайд 8}}</span><span class="badge">{{слайд 7}}</span></span></div>
      <div class="cm-row a" style="--d:0.4s"><b>{{Применимость}}</b><span class="cm-w"><i style="--w:0.2"></i><span>20%</span></span><span class="cm-where"><span class="badge">{{слайд 10}}</span></span></div>
      <div class="cm-row a" style="--d:0.5s"><b>{{Технологичность}}</b><span class="cm-w"><i style="--w:0.12"></i><span>12%</span></span><span class="cm-where"><span class="badge">{{слайд 9}}</span></span></div>
      <div class="cm-row a" style="--d:0.6s"><b>{{Презентация}}</b><span class="cm-w"><i style="--w:0.08"></i><span>8%</span></span><span class="cm-where"><span class="badge">{{вся защита}}</span></span></div>
    </div>
  </div>
</section>
