<section class="slide" id="testimonial-metric" data-title="Отзыв с цифрой">
  <h2 class="title a">{{Клиент сказал}}, <em>{{цифра подтвердила}}</em></h2>

  <div class="body is-tall">
    <div class="tm2">
      <figure class="tm2-quote a" style="--d:0.2s">
        <span class="ico is-lg" data-icon="message"></span>
        <blockquote>{{«Впервые за три года закрыли месяц без переработок»}}</blockquote>
        <figcaption><span class="tm2-av">{{ОВ}}</span><span><b>{{Ольга Васильева}}</b>{{главбух, сеть кафе «Лето»}}</span></figcaption>
      </figure>
      <div class="tm2-metric s" style="--d:0.7s">
        <span class="eyebrow">{{Переработки за месяц}}</span>
        <div class="tm2-bars">
          <span class="tm2-b is-old" style="--h:1"><span class="tm2-col"><span class="tm2-fill"><b>{{38 ч}}</b></span></span><i>{{август}}</i></span>
          <span class="tm2-b" style="--h:0.05"><span class="tm2-col"><span class="tm2-fill"><b>{{2 ч}}</b></span></span><i>{{сентябрь}}</i></span>
        </div>
      </div>
    </div>
  </div>
</section>
