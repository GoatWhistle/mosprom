<section class="slide" id="dashboard" data-title="Дашборд">
  <h2 class="title a">{{Весь склад}} <em>{{на одном экране}}</em></h2>

  <div class="body is-tall">
    <div class="dh">
      <div class="dh-kpi card s" style="--d:0.2s"><span class="kpi-label">{{Остаток}}</span><span class="dh-num">{{12 480}}</span><span class="badge is-success">{{+3%}}</span></div>
      <div class="dh-kpi card s" style="--d:0.3s"><span class="kpi-label">{{В пути}}</span><span class="dh-num">{{1 920}}</span><span class="badge">{{0%}}</span></div>
      <div class="dh-kpi card s" style="--d:0.4s"><span class="kpi-label">{{Дефицит}}</span><span class="dh-num is-danger">{{38}}</span><span class="badge is-danger">{{+12}}</span></div>
      <div class="dh-kpi card s" style="--d:0.5s"><span class="kpi-label">{{Оборот}}</span><span class="dh-num">{{4,2 дня}}</span><span class="badge is-success">{{−0,6}}</span></div>
      <div class="dh-chart card s" style="--d:0.6s"><span class="kpi-label">{{Отгрузки по дням}}</span><div data-viz="columns" data-values="320,410,380,460,520,490,610" data-labels="{{Пн}};{{Вт}};{{Ср}};{{Чт}};{{Пт}};{{Сб}};{{Вс}}" data-accent="6" data-no-ticks data-no-values data-delay="0.8"></div></div>
      <div class="dh-donut card s" style="--d:0.7s"><span class="kpi-label">{{По складам}}</span><div data-viz="donut" data-values="52,31,17" data-labels="{{Москва}};{{Казань}};{{Тула}}" data-center="52" data-unit="%" data-delay="0.9"></div></div>
    </div>
  </div>
</section>
