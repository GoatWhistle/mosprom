<section class="slide" id="guardrails" data-title="Ограждения модели">
  <h2 class="title a">{{Модель}} <em>{{за тремя барьерами}}</em></h2>

  <div class="body is-tall">
    <div class="gr">
      <div class="gr-in s" style="--d:0.2s"><span class="ico is-lg" data-icon="message"></span><b>{{Запрос}}</b></div>
      <div class="gr-wall a" style="--d:0.4s"><span class="ico" data-icon="filter"></span><b>{{Вход}}</b><span>{{убираем ПДн и инъекции}}</span><i class="badge is-danger">{{2% отсеяно}}</i></div>
      <div class="gr-core s" style="--d:0.6s"><span class="tile is-accent"><span class="ico is-lg" data-icon="bot"></span></span><b>{{Модель}}</b><span>{{только предлагает}}</span></div>
      <div class="gr-wall a" style="--d:0.8s"><span class="ico" data-icon="shield"></span><b>{{Правила}}</b><span>{{48 проверок кодом}}</span><i class="badge is-danger">{{6% отклонено}}</i></div>
      <div class="gr-wall a" style="--d:1s"><span class="ico" data-icon="eye"></span><b>{{Человек}}</b><span>{{если уверенность ниже 70%}}</span><i class="badge is-warning">{{9% на проверку}}</i></div>
      <div class="gr-out s" style="--d:1.2s"><span class="ico is-lg" data-icon="check"></span><b>{{Ответ}}</b></div>
      <span class="gr-line w" style="--d:0.3s;--t:1.2s"></span>
    </div>
  </div>
</section>
