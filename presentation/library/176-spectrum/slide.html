<section class="slide" id="spectrum" data-title="Спектр позиционирования">
  <h2 class="title a">{{Между ручным}} <em>{{и чёрным ящиком}}</em></h2>

  <div class="body is-tall">
    <div class="spc">
      <div class="spc-bar w" style="--d:0.2s;--t:1s"></div>
      <span class="spc-end is-l f" style="--d:0.3s"><b>{{Всё вручную}}</b>{{точно, но медленно}}</span>
      <span class="spc-end is-r f" style="--d:0.3s"><b>{{Чёрный ящик}}</b>{{быстро, но без объяснений}}</span>
      <span class="spc-dot pop" style="--x:0.08;--d:0.6s"><i></i>{{Excel}}</span>
      <span class="spc-dot is-low pop" style="--x:0.22;--d:0.7s"><i></i>{{1С отчёты}}</span>
      <span class="spc-dot pop" style="--x:0.78;--d:0.8s"><i></i>{{Облачный ИИ}}</span>
      <span class="spc-dot is-low pop" style="--x:0.92;--d:0.9s"><i></i>{{Чат-бот}}</span>
      <span class="spc-us pop" style="--x:0.52;--d:1.2s"><span class="mark" data-mark></span><b>{{PRODUCT}}</b>{{быстро и с причиной}}</span>
    </div>
  </div>
</section>
