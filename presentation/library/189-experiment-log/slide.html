<section class="slide" id="experiment-log" data-title="Журнал экспериментов">
  <h2 class="title a">{{Девять запусков}} <em>{{до 93%}}</em></h2>

  <div class="body is-tall">
    <div class="el">
      <div data-viz="line" data-values="61,64,72,70,79,84,82,90,93" data-unit="%" data-min="50" data-max="100" data-labels="{{#1}};{{#2}};{{#3}};{{#4}};{{#5}};{{#6}};{{#7}};{{#8}};{{#9}}" data-marks="2:{{+ поиск}};5:{{+ правила}};8:{{+ переранж.}}" data-point-values data-no-values data-names="{{F1}}"></div>
      <ul class="el-fail">
        <li class="a" style="--d:1.4s"><span class="badge is-danger">#4</span>{{больше контекста: хуже}}</li>
        <li class="a" style="--d:1.55s"><span class="badge is-danger">#7</span>{{другая модель: дороже, не лучше}}</li>
      </ul>
    </div>
  </div>
</section>
