<section class="slide" id="orbit" data-title="Орбита интеграций">
  <h2 class="title a">{{Встаёт}} <em>{{в ваш стек}}</em></h2>

  <div class="body is-tall">
    <div class="ob">
      <svg class="ob-rings" viewBox="0 0 1680 690" aria-hidden="true">
        <ellipse class="ob-ring dr" pathLength="1" style="--d:0.2s;--t:1s" cx="840" cy="345" rx="430" ry="200" />
        <ellipse class="ob-ring dr" pathLength="1" style="--d:0.3s;--t:1.2s" cx="840" cy="345" rx="760" ry="320" />
      </svg>
      <div class="ob-core s" style="--d:0.4s"><span class="mark" data-mark></span><b>{{PRODUCT}}</b></div>
      <span class="ob-sat pop" style="--a:-90deg;--rx:430px;--ry:200px;--d:0.7s"><span class="ico" data-icon="message"></span>{{Почта}}</span>
      <span class="ob-sat pop" style="--a:30deg;--rx:430px;--ry:200px;--d:0.8s"><span class="ico" data-icon="database"></span>{{1С}}</span>
      <span class="ob-sat pop" style="--a:150deg;--rx:430px;--ry:200px;--d:0.9s"><span class="ico" data-icon="users"></span>{{CRM}}</span>
      <span class="ob-sat pop" style="--a:-55deg;--rx:760px;--ry:320px;--d:1s"><span class="ico" data-icon="globe"></span>{{Сайт}}</span>
      <span class="ob-sat pop" style="--a:0deg;--rx:760px;--ry:320px;--d:1.1s"><span class="ico" data-icon="plug"></span>{{API}}</span>
      <span class="ob-sat pop" style="--a:55deg;--rx:760px;--ry:320px;--d:1.2s"><span class="ico" data-icon="file"></span>{{ЭДО}}</span>
      <span class="ob-sat pop" style="--a:125deg;--rx:760px;--ry:320px;--d:1.3s"><span class="ico" data-icon="bot"></span>{{Телеграм}}</span>
      <span class="ob-sat pop" style="--a:180deg;--rx:760px;--ry:320px;--d:1.4s"><span class="ico" data-icon="server"></span>{{Свой сервер}}</span>
      <span class="ob-sat pop" style="--a:-125deg;--rx:760px;--ry:320px;--d:1.5s"><span class="ico" data-icon="shield"></span>{{SSO}}</span>
    </div>
  </div>
</section>
